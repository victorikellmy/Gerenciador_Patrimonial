<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .cover svg { position: absolute; inset: 0; width: 960px; height: 288px; }
  .name { position: absolute; left: 48px; bottom: 44px; max-width: 440px; font-size: 64px; font-weight: 700; line-height: .95; letter-spacing: -0.02em; margin: 0; color: var(--text-primary); }
  .tag { position: absolute; left: 48px; bottom: 20px; max-width: 440px; font-size: 13px; color: var(--text-muted); margin: 0; }
  .brand   { fill: var(--primary-600); }
  .navy    { fill: var(--primary-900); }
  .tint    { fill: var(--primary-100); }
  .ok      { fill: var(--success); }
  .ink     { fill: var(--slate-300); }
  .tile    { rx: 10px; }
  .slab    { rx: 14px; }
</style>
</head>
<body>
<div class="cover">
  <!--
    blocks: brand (primary-600) 304×208 slab rx=radius-lg; navy (primary-900) 112×272 tall; tint (primary-100) 112×96; ok (success) 48×48; all sides multiples of space-4/space-8
    arrangement: one tall navy slab at the right edge bleeding off top and bottom, the brand slab beside it, tint and success satellites below — a flush modular grid like the app shell (sidebar + content cards)
    pattern: geometric, modular, dense UI → tiles cut by radius-md (10px), some merged two-wide like the KPI cards; a 48px pitch (space-8) with 16px gaps (space-4)
    scales: space-4 16, space-8 48, radius-md 10, radius-lg 14
  -->
  <svg viewBox="0 0 960 288" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <!-- tall navy slab bleeding off top/bottom -->
    <rect class="navy slab" x="832" y="-16" width="112" height="320"/>
    <!-- brand slab -->
    <rect class="brand slab" x="512" y="16" width="304" height="208"/>
    <!-- tiles cut from the brand slab (ground colour), modular grid: 48px pitch, 16px gap -->
    <g>
      <rect class="tint tile" x="528" y="32" width="48" height="48"/>
      <rect class="tint tile" x="592" y="32" width="112" height="48"/>
      <rect class="tint tile" x="720" y="32" width="48" height="48"/>
      <rect class="tint tile" x="528" y="96" width="112" height="48"/>
      <rect class="ok tile"   x="656" y="96" width="48" height="48"/>
      <rect class="tint tile" x="720" y="96" width="48" height="48"/>
      <rect class="tint tile" x="528" y="160" width="48" height="48"/>
      <rect class="tint tile" x="592" y="160" width="48" height="48"/>
      <rect class="tint tile" x="656" y="160" width="112" height="48"/>
    </g>
    <!-- satellites below the slab -->
    <rect class="tint tile" x="512" y="240" width="112" height="48"/>
    <rect class="ink tile"  x="640" y="240" width="48" height="48"/>
    <rect class="brand tile" x="704" y="240" width="112" height="48"/>
    <!-- tiles inside the navy slab -->
    <rect class="brand tile" x="848" y="48"  width="80" height="48"/>
    <rect class="tint tile"  x="848" y="112" width="80" height="48"/>
    <rect class="brand tile" x="848" y="176" width="80" height="48"/>
  </svg>
  <h1 class="name">FPTO Design System</h1>
  <p class="tag">Sistemas internos da Fundação Pró-Tocantins</p>
</div>
</body>
</html>
