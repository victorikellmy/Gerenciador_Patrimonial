# =============================================================================
# Perfil PROD — PostgreSQL.
# Credenciais devem vir de variáveis de ambiente (nunca commitar senhas).
# =============================================================================
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/patrimonial}
    username: ${DB_USER:patrimonial}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
  flyway:
    enabled: true
    # Migrations específicas do Postgres (índices funcionais, pg_trgm) ficam
    # FORA de db/migration — o Flyway varre aquela pasta recursivamente, e o
    # H2 do dev/testes não pode enxergá-las.
    locations: classpath:db/migration,classpath:db/vendor/postgresql

# Em produção o seed automático fica desligado — dados reais vêm via importação manual.
app:
  importacao:
    habilitada: false

logging:
  level:
    root: INFO
    com.fundacao.gerenciador_patrimonial: INFO
