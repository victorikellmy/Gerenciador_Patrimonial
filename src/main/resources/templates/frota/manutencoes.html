<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Manutenções')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container-fluid pb-5">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="page-header">
        <div>
            <h1 class="page-title">Manutenções e revisões</h1>
            <div class="page-subtitle"><span th:text="${pagina.totalElements}">0</span> registro(s)</div>
        </div>
        <div class="d-flex gap-2 flex-wrap">
            <div sec:authorize="hasAnyRole('ADMINISTRADOR','FISCAL')" class="d-flex gap-1">
                <a class="btn btn-secondary" th:href="@{/frota/manutencoes/download(veiculoId=${filtro.veiculoId},de=${filtro.de},ate=${filtro.ate},texto=${filtro.texto},formato='xlsx')}"><i class="bi bi-file-earmark-excel"></i> Excel</a>
                <a class="btn btn-secondary" th:href="@{/frota/manutencoes/download(veiculoId=${filtro.veiculoId},de=${filtro.de},ate=${filtro.ate},texto=${filtro.texto},formato='pdf')}"><i class="bi bi-file-earmark-pdf"></i> PDF</a>
            </div>
            <a class="btn btn-primary" th:href="@{/frota/manutencoes/novo}" sec:authorize="!hasRole('GERENTE')"><i class="bi bi-plus-lg"></i> Nova manutenção</a>
        </div>
    </div>

    <div th:replace="~{frota/filtro :: filtro(@{/frota/manutencoes}, false)}"></div>

    <div class="card card-panel" style="overflow:hidden;">
        <div class="table-responsive" th:if="${!pagina.empty}">
            <table class="table table-hover align-middle mb-0">
                <thead><tr>
                    <th>Data</th><th>Veículo</th><th>Serviço</th><th class="text-end">Km</th>
                    <th>Descrição</th><th>Fornecedor</th><th class="text-end">Valor (R$)</th><th>Próx. revisão</th><th>Responsável</th>
                    <th class="text-end" style="width:90px;"></th>
                </tr></thead>
                <tbody>
                    <tr th:each="m : ${pagina.content}">
                        <td class="text-nowrap" th:text="${#temporals.format(m.data, 'dd/MM/yyyy')}"></td>
                        <td><a th:href="@{'/frota/' + ${m.veiculoId}}" class="fw-semibold" th:text="${m.placa} + ' · ' + ${m.modelo}"></a></td>
                        <td th:text="${m.servico.rotulo}"></td>
                        <td class="text-end" th:text="${m.km != null} ? ${#numbers.formatInteger(m.km, 1, 'POINT')} : '—'"></td>
                        <td class="small" th:text="${m.descricao} ?: '—'"></td>
                        <td th:text="${m.fornecedor} ?: '—'"></td>
                        <td class="text-end fw-semibold" th:text="${#numbers.formatDecimal(m.valor, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td class="small">
                            <span th:if="${m.proximaRevisaoKm != null}" th:text="${#numbers.formatInteger(m.proximaRevisaoKm, 1, 'POINT')} + ' km'"></span>
                            <span th:if="${m.proximaRevisaoData != null}" th:text="(${m.proximaRevisaoKm != null} ? ' / ' : '') + ${#temporals.format(m.proximaRevisaoData, 'dd/MM/yyyy')}"></span>
                            <span th:if="${m.proximaRevisaoKm == null and m.proximaRevisaoData == null}">—</span>
                        </td>
                        <td>
                            <span th:text="${m.motorista}"></span>
                            <a class="ms-1" th:if="${m.possuiNotaFiscal}" target="_blank" title="Abrir nota fiscal"
                               th:href="@{'/frota/manutencoes/' + ${m.id} + '/nota-fiscal'}"><i class="bi bi-receipt"></i></a>
                            <span class="badge badge-plain text-bg-light text-muted ms-1" th:unless="${m.possuiNotaFiscal}">sem NF</span>
                        </td>
                        <td class="text-end">
                            <div class="d-inline-flex gap-1" sec:authorize="hasAnyRole('ADMINISTRADOR','FISCAL')">
                                <a class="btn btn-sm btn-secondary btn-icon" th:href="@{'/frota/manutencoes/' + ${m.id} + '/editar'}" title="Editar"><i class="bi bi-pencil"></i></a>
                                <form th:action="@{'/frota/manutencoes/' + ${m.id} + '/excluir'}" method="post" class="d-inline" sec:authorize="hasRole('ADMINISTRADOR')"
                                      onsubmit="return confirm('Excluir esta manutenção?');">
                                    <button class="btn btn-sm btn-danger btn-icon" type="submit" title="Excluir"><i class="bi bi-trash"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${pagina.empty}" th:replace="~{fragments/ui-kit :: empty-state('bi-wrench-adjustable', 'Nenhuma manutenção', 'Nenhum registro para o filtro informado.', null, null)}"></div>
    </div>

    <div th:replace="~{frota/filtro :: paginacao(@{/frota/manutencoes})}"></div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
