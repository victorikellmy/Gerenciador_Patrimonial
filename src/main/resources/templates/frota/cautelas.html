<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Cautelas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container-fluid pb-5">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="page-header">
        <div>
            <h1 class="page-title">Cautelas de veículo</h1>
            <div class="page-subtitle">Veículo entregue a condutor externo com termo de responsabilidade · <span th:text="${pagina.totalElements}">0</span> registro(s)</div>
        </div>
        <a class="btn btn-primary" th:href="@{/frota/cautelas/nova}" sec:authorize="!hasRole('GERENTE')"><i class="bi bi-plus-lg"></i> Nova cautela</a>
    </div>

    <div th:replace="~{frota/filtro :: filtro(@{/frota/cautelas}, true)}"></div>

    <div class="card card-panel" style="overflow:hidden;">
        <div class="table-responsive" th:if="${!pagina.empty}">
            <table class="table table-hover align-middle mb-0">
                <thead><tr>
                    <th>Nº</th><th>Data</th><th>Veículo</th><th>Condutor</th><th>Destino / motivo</th><th>Saída</th><th>Chegada</th><th class="text-end">Km</th>
                    <th class="text-end" style="width:260px;"></th>
                </tr></thead>
                <tbody>
                    <tr th:each="c : ${pagina.content}" th:classappend="${c.emAndamento} ? 'row-na-rua'">
                        <td th:text="${c.id}"></td>
                        <td class="text-nowrap" th:text="${#temporals.format(c.dataViagem, 'dd/MM/yyyy')}"></td>
                        <td><a th:href="@{'/frota/' + ${c.veiculoId}}" class="fw-semibold" th:text="${c.placa} + ' · ' + ${c.modelo}"></a></td>
                        <td><div class="cell-stack"><span class="cell-primary" th:text="${c.motoristaNome}"></span>
                            <span class="cell-secondary" th:text="(${c.lotacao} ?: '') + ' · ' + (${c.fone} ?: '')"></span></div></td>
                        <td><div class="cell-stack"><span class="cell-primary" th:text="${c.destino}"></span><span class="cell-secondary" th:text="${c.motivo}"></span></div></td>
                        <td class="small text-nowrap" th:text="(${c.horaSaida} != null ? ${#temporals.format(c.horaSaida, 'HH:mm')} : '—') + (${c.kmInicial} != null ? ' · km ' + ${c.kmInicial} : '')"></td>
                        <td class="small text-nowrap">
                            <span th:if="${c.emAndamento}" class="badge badge-plain text-bg-warning">em aberto</span>
                            <span th:unless="${c.emAndamento}" th:text="(${c.horaChegada} != null ? ${#temporals.format(c.horaChegada, 'HH:mm')} : '—') + ' · km ' + ${c.kmFinal}"></span>
                        </td>
                        <td class="text-end" th:text="${c.kmRodados} ?: '—'"></td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-secondary" th:href="@{'/frota/cautelas/' + ${c.id} + '/termo'}" target="_blank" title="Termo em PDF"><i class="bi bi-file-earmark-pdf"></i> Termo</a>
                            <form th:if="${c.emAndamento}" sec:authorize="!hasRole('GERENTE')" th:action="@{'/frota/cautelas/' + ${c.id} + '/finalizar'}" method="post" class="d-inline-flex gap-1 align-items-center">
                                <input type="time" name="horaChegada" class="form-control form-control-sm" style="width:100px;"/>
                                <input type="number" name="kmFinal" class="form-control form-control-sm" style="width:105px;" placeholder="km final" required th:min="${c.kmInicial} ?: 0"/>
                                <button class="btn btn-sm btn-warning btn-icon" type="submit" title="Encerrar cautela"><i class="bi bi-box-arrow-in-left"></i></button>
                            </form>
                            <div class="d-inline-flex gap-1" sec:authorize="hasAnyRole('ADMINISTRADOR','FISCAL')">
                                <a class="btn btn-sm btn-secondary btn-icon" th:href="@{'/frota/cautelas/' + ${c.id} + '/editar'}" title="Editar"><i class="bi bi-pencil"></i></a>
                                <form th:action="@{'/frota/cautelas/' + ${c.id} + '/excluir'}" method="post" class="d-inline" sec:authorize="hasRole('ADMINISTRADOR')"
                                      onsubmit="return confirm('Excluir esta cautela?');">
                                    <button class="btn btn-sm btn-danger btn-icon" type="submit" title="Excluir"><i class="bi bi-trash"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${pagina.empty}" th:replace="~{fragments/ui-kit :: empty-state('bi-key', 'Nenhuma cautela', 'Nenhum registro para o filtro informado.', null, null)}"></div>
    </div>

    <div th:replace="~{frota/filtro :: paginacao(@{/frota/cautelas})}"></div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
