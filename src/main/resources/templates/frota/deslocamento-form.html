<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head(${editando} ? 'Editar deslocamento' : 'Registrar saída')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container pb-5">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="page-header">
        <div class="d-flex align-items-center gap-3">
            <a class="btn btn-secondary btn-icon" th:href="${veiculo != null} ? @{'/frota/' + ${veiculo.id}} : @{/frota}" title="Voltar"><i class="bi bi-arrow-left"></i></a>
            <div>
                <h1 class="page-title" th:text="${editando} ? 'Editar deslocamento' : 'Registrar saída do veículo'">Deslocamento</h1>
                <div class="page-subtitle" th:if="${veiculo != null}" th:text="${veiculo.placa} + ' · ' + ${veiculo.modelo} + (${veiculo.kmAtual != null} ? ' · km atual ' + ${#numbers.formatInteger(veiculo.kmAtual, 1, 'POINT')} : '')"></div>
                <div class="page-subtitle" th:unless="${editando}">Deixe km final em branco se o veículo ainda vai voltar: a chegada é registrada depois na ficha.</div>
            </div>
        </div>
    </div>

    <form th:action="${editando} ? @{'/frota/deslocamentos/' + ${regId}} : @{/frota/deslocamentos}"
          th:object="${deslocamentoForm}" method="post" class="card card-panel" style="overflow:hidden; max-width: 960px;">
        <div class="form-section">
            <div th:replace="~{fragments/ui-kit :: section-header('bi-signpost-2', 'Saída', null)}"></div>
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label required">Veículo</label>
                    <select class="form-select" th:field="*{veiculoId}" th:classappend="${#fields.hasErrors('veiculoId')} ? 'is-invalid'" required>
                        <option value="">— selecione —</option>
                        <option th:each="v : ${veiculos}" th:value="${v.id}" th:text="${v.rotulo}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('veiculoId')}" th:errors="*{veiculoId}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label required">Data da viagem</label>
                    <input type="date" class="form-control" th:field="*{dataViagem}" required th:classappend="${#fields.hasErrors('dataViagem')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('dataViagem')}" th:errors="*{dataViagem}"></div>
                </div>
                <div class="col-md-8">
                    <label class="form-label required">Destino</label>
                    <input type="text" class="form-control" th:field="*{destino}" maxlength="160" required placeholder="Ex.: HGP Palmas / 5º BPM Porto Nacional"
                           th:classappend="${#fields.hasErrors('destino')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('destino')}" th:errors="*{destino}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label required">Motivo</label>
                    <select class="form-select" th:field="*{motivo}" required th:classappend="${#fields.hasErrors('motivo')} ? 'is-invalid'">
                        <option value="">— selecione —</option>
                        <option th:each="m : ${motivos}" th:value="${m}" th:text="${m}"></option>
                        <option th:if="${editando and deslocamentoForm.motivo != null and !motivos.contains(deslocamentoForm.motivo)}"
                                th:value="${deslocamentoForm.motivo}" th:text="${deslocamentoForm.motivo}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('motivo')}" th:errors="*{motivo}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Titular (militar / servidor atendido)</label>
                    <input type="text" class="form-control" th:field="*{titular}" maxlength="160"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Assistido</label>
                    <input type="text" class="form-control" th:field="*{assistido}" maxlength="160"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Hora de saída</label>
                    <input type="time" class="form-control" th:field="*{horaSaida}"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Km inicial</label>
                    <input type="number" class="form-control" th:field="*{kmInicial}" min="0" th:classappend="${#fields.hasErrors('kmInicial')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('kmInicial')}" th:errors="*{kmInicial}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Hora de chegada</label>
                    <input type="time" class="form-control" th:field="*{horaChegada}"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Km final</label>
                    <input type="number" class="form-control" th:field="*{kmFinal}" min="0" th:classappend="${#fields.hasErrors('kmFinal')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('kmFinal')}" th:errors="*{kmFinal}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label required">Motorista</label>
                    <input type="text" class="form-control" th:field="*{motorista}" maxlength="160" required th:classappend="${#fields.hasErrors('motorista')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('motorista')}" th:errors="*{motorista}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Lotação / unidade</label>
                    <select class="form-select" th:field="*{lotacao}">
                        <option value="">— selecione —</option>
                        <option th:each="l : ${lotacoesFrota}" th:value="${l}" th:text="${l}"></option>
                        <option th:if="${deslocamentoForm.lotacao != null and !lotacoesFrota.contains(deslocamentoForm.lotacao)}"
                                th:value="${deslocamentoForm.lotacao}" th:text="${deslocamentoForm.lotacao}"></option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Observação</label>
                    <input type="text" class="form-control" th:field="*{observacao}" maxlength="500"/>
                </div>
            </div>
        </div>
        <div class="sticky-actions">
            <span class="actions-hint"><i class="bi bi-info-circle"></i> Sem km final o veículo fica como "na rua" até a chegada.</span>
            <a class="btn btn-secondary" th:href="${veiculo != null} ? @{'/frota/' + ${veiculo.id}} : @{/frota}">Cancelar</a>
            <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> <span th:text="${editando} ? 'Salvar alterações' : 'Registrar saída'"></span></button>
        </div>
    </form>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
