<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>
<!--
    Fragmentos compartilhados pelas listagens da frota.
    Esperam no modelo: filtro (FiltroFrota), veiculos (selects), pagina (Page).
-->

<!-- ============================ FILTRO ============================ -->
<div th:fragment="filtro(acao, comAbertos)" class="card card-panel mb-4" style="overflow:hidden;">
    <form th:action="${acao}" method="get" class="form-section row g-2 align-items-end" style="border-bottom:none;">
        <div class="col-md-3">
            <label class="form-label small mb-1">Veículo</label>
            <select class="form-select form-select-sm" name="veiculoId">
                <option value="">Todos</option>
                <option th:each="v : ${veiculos}" th:value="${v.id}" th:selected="${filtro.veiculoId == v.id}" th:text="${v.rotulo}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <label class="form-label small mb-1">De</label>
            <input type="date" class="form-control form-control-sm" name="de" th:value="${filtro.de}"/>
        </div>
        <div class="col-md-2">
            <label class="form-label small mb-1">Até</label>
            <input type="date" class="form-control form-control-sm" name="ate" th:value="${filtro.ate}"/>
        </div>
        <div class="col-md-3">
            <label class="form-label small mb-1">Busca</label>
            <input type="text" class="form-control form-control-sm" name="texto" th:value="${filtro.texto}" placeholder="placa, motorista, destino, posto..."/>
        </div>
        <div class="col-md-1" th:if="${comAbertos}">
            <div class="form-check mt-4">
                <input class="form-check-input" type="checkbox" name="somenteAbertos" value="true" id="somenteAbertos" th:checked="${filtro.somenteAbertos}"/>
                <label class="form-check-label small" for="somenteAbertos">Na rua</label>
            </div>
        </div>
        <div class="col-md-1 d-flex gap-1">
            <button class="btn btn-sm btn-primary w-100" type="submit" title="Filtrar"><i class="bi bi-funnel"></i></button>
            <a class="btn btn-sm btn-secondary" th:href="${acao}" th:unless="${filtro.vazio()}" title="Limpar"><i class="bi bi-x-lg"></i></a>
        </div>
    </form>
</div>

<!-- ============================ AUTOCOMPLETE DE TITULARES ============================ -->
<!-- Para inputs com data-autocomplete="titulares": sugere nomes da base de militares/pensionistas. -->
<th:block th:fragment="autocompleteTitulares">
<script th:inline="javascript">
    (function () {
        const url = /*[[@{/frota/titulares}]]*/ '/frota/titulares';
        document.querySelectorAll('input[data-autocomplete="titulares"]').forEach(function (campo) {
            const lista = document.createElement('datalist');
            lista.id = 'dl-' + (campo.id || Math.random().toString(36).slice(2));
            campo.setAttribute('list', lista.id);
            campo.insertAdjacentElement('afterend', lista);
            let timer = null;
            campo.addEventListener('input', function () {
                const termo = campo.value.trim();
                clearTimeout(timer);
                if (termo.length < 2) { lista.innerHTML = ''; return; }
                timer = setTimeout(function () {
                    fetch(url + '?termo=' + encodeURIComponent(termo), {credentials: 'same-origin'})
                        .then(r => r.ok ? r.json() : [])
                        .then(nomes => { lista.innerHTML = nomes.map(n => '<option value="' + n.replace(/"/g, '&quot;') + '">').join(''); })
                        .catch(() => {});
                }, 200);
            });
        });
    })();
</script>
</th:block>

<!-- ============================ PAGINAÇÃO ============================ -->
<nav th:fragment="paginacao(acao)" th:if="${pagina.totalPages > 1}" class="mt-3" aria-label="Paginação">
    <ul class="pagination pagination-sm justify-content-center mb-0">
        <li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
            <a class="page-link" th:href="@{${acao}(veiculoId=${filtro.veiculoId},de=${filtro.de},ate=${filtro.ate},texto=${filtro.texto},somenteAbertos=${filtro.somenteAbertos},page=${pagina.number - 1},size=${pagina.size})}">&laquo;</a>
        </li>
        <li class="page-item disabled"><span class="page-link" th:text="${pagina.number + 1} + ' / ' + ${pagina.totalPages}"></span></li>
        <li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
            <a class="page-link" th:href="@{${acao}(veiculoId=${filtro.veiculoId},de=${filtro.de},ate=${filtro.ate},texto=${filtro.texto},somenteAbertos=${filtro.somenteAbertos},page=${pagina.number + 1},size=${pagina.size})}">&raquo;</a>
        </li>
    </ul>
</nav>
</body>
</html>
