<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head(${editando} ? 'Editar cautela' : 'Nova cautela')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container pb-5">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="page-header">
        <div class="d-flex align-items-center gap-3">
            <a class="btn btn-secondary btn-icon" th:href="@{/frota/cautelas}" title="Voltar"><i class="bi bi-arrow-left"></i></a>
            <div>
                <h1 class="page-title" th:text="${editando} ? 'Editar cautela nº ' + ${cautela.id} : 'Nova cautela de veículo'">Cautela</h1>
                <div class="page-subtitle">Entrega do veículo a um condutor externo. Ao salvar, imprima o termo e recolha a assinatura.</div>
            </div>
        </div>
    </div>

    <form th:action="${editando} ? @{'/frota/cautelas/' + ${cautela.id}} : @{/frota/cautelas}" th:object="${cautelaForm}" method="post"
          class="card card-panel" style="overflow:hidden; max-width:960px;">
        <div class="form-section">
            <div th:replace="~{fragments/ui-kit :: section-header('bi-truck-front', 'Veículo e viagem', null)}"></div>
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label required">Veículo</label>
                    <select class="form-select" th:field="*{veiculoId}" required th:classappend="${#fields.hasErrors('veiculoId')} ? 'is-invalid'">
                        <option value="">— selecione —</option>
                        <option th:each="v : ${veiculos}" th:value="${v.id}" th:text="${v.rotulo}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('veiculoId')}" th:errors="*{veiculoId}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label required">Data</label>
                    <input type="date" class="form-control" th:field="*{dataViagem}" required/>
                </div>
                <div class="col-md-8">
                    <label class="form-label required">Destino</label>
                    <input type="text" class="form-control" th:field="*{destino}" maxlength="160" required th:classappend="${#fields.hasErrors('destino')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('destino')}" th:errors="*{destino}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label required">Motivo</label>
                    <select class="form-select" th:field="*{motivo}" required>
                        <option th:each="m : ${motivos}" th:value="${m}" th:text="${m}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Responsável (militar / servidor atendido)</label>
                    <input type="text" class="form-control" th:field="*{responsavel}" maxlength="160" data-autocomplete="titulares" autocomplete="off"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Assistido</label>
                    <input type="text" class="form-control" th:field="*{assistido}" maxlength="160"/>
                </div>
                <div class="col-md-3"><label class="form-label">Hora de saída</label><input type="time" class="form-control" th:field="*{horaSaida}"/></div>
                <div class="col-md-3"><label class="form-label">Km inicial</label><input type="number" class="form-control" th:field="*{kmInicial}" min="0"/></div>
                <div class="col-md-3"><label class="form-label">Hora de chegada</label><input type="time" class="form-control" th:field="*{horaChegada}"/></div>
                <div class="col-md-3"><label class="form-label">Km final</label><input type="number" class="form-control" th:field="*{kmFinal}" min="0"/></div>
            </div>
        </div>

        <div class="form-section">
            <div th:replace="~{fragments/ui-kit :: section-header('bi-person-badge', 'Condutor que recebe o veículo', 'Dados que vão no termo de responsabilidade.')}"></div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label required">Nome</label>
                    <input type="text" class="form-control text-uppercase" th:field="*{motoristaNome}" maxlength="160" required data-autocomplete="titulares" autocomplete="off"
                           th:classappend="${#fields.hasErrors('motoristaNome')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('motoristaNome')}" th:errors="*{motoristaNome}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label required">Lotação / unidade</label>
                    <input type="text" class="form-control" th:field="*{lotacao}" maxlength="60" required list="lotacoesLista" th:classappend="${#fields.hasErrors('lotacao')} ? 'is-invalid'"/>
                    <datalist id="lotacoesLista"><option th:each="l : ${lotacoesFrota}" th:value="${l}"></option></datalist>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('lotacao')}" th:errors="*{lotacao}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label required">RG</label>
                    <input type="text" class="form-control" th:field="*{rg}" maxlength="30" required th:classappend="${#fields.hasErrors('rg')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('rg')}" th:errors="*{rg}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label required">CPF</label>
                    <input type="text" class="form-control" th:field="*{cpf}" maxlength="14" required placeholder="000.000.000-00" th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label required">Telefone</label>
                    <input type="text" class="form-control" th:field="*{fone}" maxlength="25" required th:classappend="${#fields.hasErrors('fone')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fone')}" th:errors="*{fone}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label">Observação</label>
                    <input type="text" class="form-control" th:field="*{observacao}" maxlength="500"/>
                </div>
            </div>
        </div>

        <div class="sticky-actions">
            <span class="actions-hint"><i class="bi bi-info-circle"></i> Sem km final a cautela fica em aberto até o retorno do veículo.</span>
            <a class="btn btn-secondary" th:href="@{/frota/cautelas}">Cancelar</a>
            <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> <span th:text="${editando} ? 'Salvar alterações' : 'Registrar cautela'"></span></button>
        </div>
    </form>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
<div th:replace="~{frota/filtro :: autocompleteTitulares}"></div>
</body>
</html>
