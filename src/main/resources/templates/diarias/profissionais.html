<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Profissionais')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container-fluid pb-5">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="page-header">
        <div>
            <h1 class="page-title">Profissionais</h1>
            <div class="page-subtitle">Quem recebe diária: nível funcional (tabela de valores), CPF e dados bancários.</div>
        </div>
        <a class="btn btn-primary" th:href="@{/diarias/profissionais/novo}"><i class="bi bi-plus-lg"></i> Novo profissional</a>
    </div>

    <div class="card card-panel mb-4" style="overflow:hidden;">
        <form th:action="@{/diarias/profissionais}" method="get" class="form-section row g-2 align-items-end" style="border-bottom:none;">
            <div class="col-md-6"><label class="form-label small mb-1">Busca</label>
                <input type="text" class="form-control form-control-sm" name="busca" th:value="${busca}" placeholder="nome, CPF ou matrícula"/></div>
            <div class="col-md-2"><button class="btn btn-sm btn-primary w-100" type="submit"><i class="bi bi-search"></i> Buscar</button></div>
        </form>
    </div>

    <div class="card card-panel" style="overflow:hidden;">
        <div class="table-responsive" th:if="${!profissionais.isEmpty()}">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>Nome</th><th>Matrícula</th><th>Lotação</th><th>Cargo / posto</th><th>CPF</th><th>Dados bancários</th><th>Situação</th><th class="text-end"></th></tr></thead>
                <tbody>
                    <tr th:each="p : ${profissionais}" th:classappend="${!p.ativo} ? 'text-muted'">
                        <td class="fw-semibold" th:text="${p.nome}"></td>
                        <td th:text="${p.matricula} ?: '—'"></td>
                        <td class="small" th:text="${p.lotacao} ?: '—'"></td>
                        <td class="small" th:text="${p.nivelDescricao}"></td>
                        <td th:text="${p.cpf}"></td>
                        <td class="small" th:text="${p.dadosBancarios} ?: '—'"></td>
                        <td><span class="badge badge-plain" th:classappend="${p.ativo} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${p.ativo} ? 'Ativo' : 'Inativo'"></span></td>
                        <td class="text-end">
                            <div class="d-inline-flex gap-1">
                                <a class="btn btn-sm btn-secondary btn-icon" th:href="@{'/diarias/profissionais/' + ${p.id} + '/editar'}" title="Editar"><i class="bi bi-pencil"></i></a>
                                <form th:action="@{'/diarias/profissionais/' + ${p.id} + '/ativo'}" method="post" class="d-inline">
                                    <input type="hidden" name="ativo" th:value="${!p.ativo}"/>
                                    <button class="btn btn-sm btn-icon" th:classappend="${p.ativo} ? 'btn-outline-danger' : 'btn-outline-success'" type="submit"
                                            th:title="${p.ativo} ? 'Inativar' : 'Reativar'"><i class="bi" th:classappend="${p.ativo} ? 'bi-x-circle' : 'bi-check-circle'"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${profissionais.isEmpty()}" th:replace="~{fragments/ui-kit :: empty-state('bi-person-vcard', 'Nenhum profissional', 'Cadastre quem recebe diárias.', @{/diarias/profissionais/novo}, 'Novo profissional')}"></div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
