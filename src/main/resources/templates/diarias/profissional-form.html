<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head(${profissional != null} ? 'Editar profissional' : 'Novo profissional')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container pb-5">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="page-header">
        <div class="d-flex align-items-center gap-3">
            <a class="btn btn-secondary btn-icon" th:href="@{/diarias/profissionais}" title="Voltar"><i class="bi bi-arrow-left"></i></a>
            <div>
                <h1 class="page-title" th:text="${profissional != null} ? 'Editar profissional' : 'Novo profissional'">Profissional</h1>
                <div class="page-subtitle" th:if="${profissional != null}" th:text="${profissional.nome}"></div>
            </div>
        </div>
    </div>

    <form th:action="${profissional != null} ? @{'/diarias/profissionais/' + ${profissional.id}} : @{/diarias/profissionais}"
          th:object="${profissionalForm}" method="post" class="card card-panel" style="overflow:hidden; max-width:900px;">
        <div class="form-section">
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label required">Nome completo</label>
                    <input type="text" class="form-control text-uppercase" th:field="*{nome}" maxlength="160" required th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Matrícula</label>
                    <input type="text" class="form-control" th:field="*{matricula}" maxlength="30"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label required">Cargo / posto / graduação</label>
                    <select class="form-select" th:field="*{nivelId}" required th:classappend="${#fields.hasErrors('nivelId')} ? 'is-invalid'">
                        <option value="">— selecione —</option>
                        <option th:each="n : ${niveis}" th:value="${n.id}" th:text="${n.descricao}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nivelId')}" th:errors="*{nivelId}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Lotação</label>
                    <input type="text" class="form-control" th:field="*{lotacao}" maxlength="60" list="lotacoesLista"/>
                    <datalist id="lotacoesLista"><option th:each="l : ${lotacoesFrota}" th:value="${l}"></option></datalist>
                </div>
                <div class="col-md-4">
                    <label class="form-label required">CPF</label>
                    <input type="text" class="form-control" th:field="*{cpf}" maxlength="14" required placeholder="000.000.000-00" th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">RG</label>
                    <input type="text" class="form-control" th:field="*{rg}" maxlength="30"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Órgão expedidor</label>
                    <input type="text" class="form-control" th:field="*{orgaoExpedidor}" maxlength="30"/>
                </div>
                <div class="col-12">
                    <label class="form-label">Dados bancários (banco / agência / conta)</label>
                    <input type="text" class="form-control" th:field="*{dadosBancarios}" maxlength="160"/>
                </div>
            </div>
        </div>
        <div class="sticky-actions">
            <span class="actions-hint"><i class="bi bi-info-circle"></i> O cargo define a tabela de valores usada nas diárias.</span>
            <a class="btn btn-secondary" th:href="@{/diarias/profissionais}">Cancelar</a>
            <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Salvar</button>
        </div>
    </form>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
