<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head(${editando} ? 'Editar diária' : 'Nova diária')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container pb-5">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="page-header">
        <div class="d-flex align-items-center gap-3">
            <a class="btn btn-secondary btn-icon" th:href="${editando} ? @{'/diarias/' + ${diaria.id}} : @{/diarias}" title="Voltar"><i class="bi bi-arrow-left"></i></a>
            <div>
                <h1 class="page-title" th:text="${editando} ? 'Editar solicitação nº ' + ${diaria.id} : 'Nova solicitação de diária'">Diária</h1>
                <div class="page-subtitle">Portaria 004/2018 GAB. Pres FPTO. O valor unitário é sugerido pela tabela do profissional.</div>
            </div>
        </div>
    </div>

    <form th:action="${editando} ? @{'/diarias/' + ${diaria.id}} : @{/diarias}" th:object="${diariaForm}" method="post"
          class="card card-panel" style="overflow:hidden;">
        <div class="form-section">
            <div th:replace="~{fragments/ui-kit :: section-header('bi-person-vcard', 'Profissional', null)}"></div>
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label required">Profissional</label>
                    <select class="form-select" th:field="*{profissionalId}" id="profissionalId" required th:classappend="${#fields.hasErrors('profissionalId')} ? 'is-invalid'">
                        <option value="">— selecione —</option>
                        <option th:each="p : ${profissionais}" th:value="${p.id}"
                                th:text="${p.nome} + (${p.lotacao} != null ? ' · ' + ${p.lotacao} : '') + ' · ' + ${p.nivelDescricao}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('profissionalId')}" th:errors="*{profissionalId}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Tabela do profissional</label>
                    <div class="d-flex gap-1 flex-wrap" id="valoresTabela">
                        <span class="text-muted small">Selecione o profissional para ver os valores.</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-section">
            <div th:replace="~{fragments/ui-kit :: section-header('bi-signpost-split', 'Viagem', null)}"></div>
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label required">Itinerário</label>
                    <input type="text" class="form-control" th:field="*{itinerario}" maxlength="200" required placeholder="Palmas → Araguaína → Palmas"
                           th:classappend="${#fields.hasErrors('itinerario')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('itinerario')}" th:errors="*{itinerario}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label required">Meio de transporte</label>
                    <select class="form-select" th:field="*{meioTransporte}" required>
                        <option th:each="m : ${meios}" th:value="${m}" th:text="${m.rotulo}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label required">Partida</label>
                    <input type="date" class="form-control" th:field="*{partida}" required th:classappend="${#fields.hasErrors('partida')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('partida')}" th:errors="*{partida}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Hora de saída</label>
                    <input type="time" class="form-control" th:field="*{horaSaida}"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label required">Retorno</label>
                    <input type="date" class="form-control" th:field="*{retorno}" required th:classappend="${#fields.hasErrors('retorno')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('retorno')}" th:errors="*{retorno}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Hora de chegada</label>
                    <input type="time" class="form-control" th:field="*{horaChegada}"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label required">Recurso</label>
                    <select class="form-select" th:field="*{recurso}" required>
                        <option th:each="r : ${recursos}" th:value="${r}" th:text="${r.rotulo}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label required">Nº de diárias</label>
                    <input type="number" step="0.5" min="0.5" class="form-control" th:field="*{numeroDiarias}" id="numeroDiarias" required
                           th:classappend="${#fields.hasErrors('numeroDiarias')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('numeroDiarias')}" th:errors="*{numeroDiarias}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label required">Valor unitário (R$)</label>
                    <input type="number" step="0.01" min="0" class="form-control" th:field="*{valorUnitario}" id="valorUnitario" required
                           th:classappend="${#fields.hasErrors('valorUnitario')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('valorUnitario')}" th:errors="*{valorUnitario}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Total (R$)</label>
                    <input type="text" class="form-control" id="valorTotal" readonly value="0,00"/>
                </div>
                <div class="col-12">
                    <label class="form-label">Finalidade da viagem</label>
                    <textarea class="form-control" th:field="*{finalidade}" rows="3" maxlength="2000"></textarea>
                </div>
            </div>
        </div>

        <div class="sticky-actions">
            <span class="actions-hint"><i class="bi bi-info-circle"></i> Clique num valor da tabela para preencher o valor unitário.</span>
            <a class="btn btn-secondary" th:href="${editando} ? @{'/diarias/' + ${diaria.id}} : @{/diarias}">Cancelar</a>
            <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> <span th:text="${editando} ? 'Salvar alterações' : 'Abrir solicitação'"></span></button>
        </div>
    </form>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:inline="javascript">
    (function () {
        const base = /*[[@{/diarias/valores/}]]*/ '/diarias/valores/';
        const sel = document.getElementById('profissionalId');
        const caixa = document.getElementById('valoresTabela');
        const unit = document.getElementById('valorUnitario');
        const qtd = document.getElementById('numeroDiarias');
        const total = document.getElementById('valorTotal');
        const fmt = v => Number(v).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        function recalc() {
            const t = (parseFloat(qtd.value) || 0) * (parseFloat(unit.value) || 0);
            total.value = fmt(t);
        }
        function carregar() {
            if (!sel.value) { caixa.innerHTML = '<span class="text-muted small">Selecione o profissional para ver os valores.</span>'; return; }
            fetch(base + sel.value, {credentials: 'same-origin'}).then(r => r.ok ? r.json() : null).then(v => {
                if (!v) return;
                caixa.innerHTML = '';
                const faixas = [ ['Capitais', v.capitais], ['Interior do Estado', v.interiorEstado], ['Interior de outro Estado', v.interiorOutroEstado] ];
                faixas.forEach(function (par) {
                    const rot = par[0], val = par[1];
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'btn btn-sm btn-outline-primary';
                    b.textContent = rot + ': R$ ' + fmt(val);
                    b.onclick = () => { unit.value = Number(val).toFixed(2); recalc(); };
                    caixa.appendChild(b);
                });
            });
        }
        sel.addEventListener('change', carregar);
        qtd.addEventListener('input', recalc);
        unit.addEventListener('input', recalc);
        carregar();
        recalc();
    })();
</script>
</body>
</html>
