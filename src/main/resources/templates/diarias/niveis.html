<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Tabela de diárias')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container pb-5">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="page-header">
        <div>
            <h1 class="page-title">Tabela de valores de diária</h1>
            <div class="page-subtitle">Portaria 004/2018 GAB. Pres FPTO — valor por nível funcional e destino.</div>
        </div>
    </div>

    <div class="card card-panel mb-4" style="overflow:hidden;" sec:authorize="hasRole('ADMINISTRADOR')">
        <div class="form-section" style="border-bottom:none;">
            <div th:replace="~{fragments/ui-kit :: section-header('bi-table', ${editandoId != null} ? 'Editar nível' : 'Novo nível', null)}"></div>
            <form th:action="${editandoId != null} ? @{'/diarias/niveis/' + ${editandoId}} : @{/diarias/niveis}" th:object="${nivelForm}" method="post" class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label small">Descrição</label>
                    <input type="text" class="form-control form-control-sm" th:field="*{descricao}" maxlength="160" required/>
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Capitais (R$)</label>
                    <input type="number" step="0.01" min="0" class="form-control form-control-sm" th:field="*{valorCapitais}" required/>
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Interior do Estado</label>
                    <input type="number" step="0.01" min="0" class="form-control form-control-sm" th:field="*{valorInteriorEstado}" required/>
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Interior outro Estado</label>
                    <input type="number" step="0.01" min="0" class="form-control form-control-sm" th:field="*{valorInteriorOutroEstado}" required/>
                </div>
                <div class="col-md-2 d-flex gap-1">
                    <button class="btn btn-sm btn-primary w-100" type="submit"><i class="bi bi-check-lg"></i> Salvar</button>
                    <a class="btn btn-sm btn-secondary" th:href="@{/diarias/niveis}" th:if="${editandoId != null}" title="Cancelar"><i class="bi bi-x-lg"></i></a>
                </div>
            </form>
        </div>
    </div>

    <div class="card card-panel" style="overflow:hidden;">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>Nível</th><th class="text-end">Capitais</th><th class="text-end">Interior do Estado</th><th class="text-end">Interior de outro Estado</th><th>Situação</th><th class="text-end" sec:authorize="hasRole('ADMINISTRADOR')"></th></tr></thead>
                <tbody>
                    <tr th:each="n : ${niveis}" th:classappend="${!n.ativo} ? 'text-muted'">
                        <td th:text="${n.descricao}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(n.valorCapitais, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(n.valorInteriorEstado, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(n.valorInteriorOutroEstado, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td><span class="badge badge-plain" th:classappend="${n.ativo} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${n.ativo} ? 'Ativo' : 'Inativo'"></span></td>
                        <td class="text-end" sec:authorize="hasRole('ADMINISTRADOR')">
                            <div class="d-inline-flex gap-1">
                                <a class="btn btn-sm btn-secondary btn-icon" th:href="@{/diarias/niveis(editar=${n.id})}" title="Editar"><i class="bi bi-pencil"></i></a>
                                <form th:action="@{'/diarias/niveis/' + ${n.id} + '/ativo'}" method="post" class="d-inline">
                                    <input type="hidden" name="ativo" th:value="${!n.ativo}"/>
                                    <button class="btn btn-sm btn-icon" th:classappend="${n.ativo} ? 'btn-outline-danger' : 'btn-outline-success'" type="submit"><i class="bi" th:classappend="${n.ativo} ? 'bi-x-circle' : 'bi-check-circle'"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
