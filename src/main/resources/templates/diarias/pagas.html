<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Diárias pagas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container-fluid pb-5">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="page-header">
        <div>
            <h1 class="page-title">Relatório de diárias pagas</h1>
            <div class="page-subtitle">Por data de pagamento ·
                <span th:text="${#temporals.format(de, 'dd/MM/yyyy')} + ' a ' + ${#temporals.format(ate, 'dd/MM/yyyy')}"></span> ·
                <span th:text="${lista.size()}">0</span> registro(s) · total pago
                <strong th:text="'R$ ' + ${#numbers.formatDecimal(total, 1, 'POINT', 2, 'COMMA')}"></strong>
            </div>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-secondary" th:href="@{/diarias/pagas/download(de=${de},ate=${ate},formato='xlsx')}"><i class="bi bi-file-earmark-excel"></i> Excel</a>
            <a class="btn btn-secondary" th:href="@{/diarias/pagas/download(de=${de},ate=${ate},formato='pdf')}"><i class="bi bi-file-earmark-pdf"></i> PDF</a>
        </div>
    </div>

    <div class="card card-panel mb-4" style="overflow:hidden;">
        <form th:action="@{/diarias/pagas}" method="get" class="form-section row g-2 align-items-end" style="border-bottom:none;">
            <div class="col-md-3"><label class="form-label small mb-1">De</label><input type="date" class="form-control form-control-sm" name="de" th:value="${de}"/></div>
            <div class="col-md-3"><label class="form-label small mb-1">Até</label><input type="date" class="form-control form-control-sm" name="ate" th:value="${ate}"/></div>
            <div class="col-md-2"><button class="btn btn-sm btn-primary w-100" type="submit"><i class="bi bi-funnel"></i> Filtrar</button></div>
        </form>
    </div>

    <div class="card card-panel" style="overflow:hidden;">
        <div class="table-responsive" th:if="${!lista.isEmpty()}">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>Nº</th><th>Profissional</th><th>Lotação</th><th>Itinerário</th><th>Partida</th><th>Retorno</th>
                    <th class="text-end">Diárias</th><th class="text-end">Valor pago (R$)</th><th>Dt. pagamento</th><th>Recurso</th></tr></thead>
                <tbody>
                    <tr th:each="d : ${lista}">
                        <td><a th:href="@{'/diarias/' + ${d.id}}" th:text="${d.id}"></a></td>
                        <td th:text="${d.profissionalNome}"></td>
                        <td class="small" th:text="${d.profissionalLotacao} ?: '—'"></td>
                        <td th:text="${d.itinerario}"></td>
                        <td class="text-nowrap" th:text="${#temporals.format(d.partida, 'dd/MM/yyyy')}"></td>
                        <td class="text-nowrap" th:text="${#temporals.format(d.retorno, 'dd/MM/yyyy')}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(d.numeroDiarias, 1, 'POINT', 1, 'COMMA')}"></td>
                        <td class="text-end fw-semibold" th:text="${#numbers.formatDecimal(d.valorTotal, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td class="text-nowrap" th:text="${#temporals.format(d.dataPagamento, 'dd/MM/yyyy')}"></td>
                        <td th:text="${d.recurso.rotulo}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${lista.isEmpty()}" th:replace="~{fragments/ui-kit :: empty-state('bi-receipt-cutoff', 'Nenhuma diária paga', 'Nenhum pagamento no período informado.', null, null)}"></div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
