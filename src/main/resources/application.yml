# =============================================================================
# Configuração padrão — valores comuns a todos os perfis.
# Para trocar de perfil: -Dspring.profiles.active=dev | prod
# =============================================================================
spring:
  application:
    name: Gerenciador_Patrimonial
  profiles:
    active: dev                 # default: desenvolvimento com H2
  jpa:
    open-in-view: false         # boa prática: não manter sessão aberta na view
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB       # limite por arquivo anexado
      max-request-size: 25MB    # limite do request inteiro (múltiplos anexos)

server:
  servlet:
    session:
      cookie:
        same-site: lax          # protege os POSTs da SPA (/api sem CSRF) contra requisições cross-site

# Pastas de upload (Sprint 3 — StorageService local)
app:
  storage:
    tipo: LOCAL                 # LOCAL | S3 (futuro)
    pasta-raiz: ./uploads
  integracao:
    # Usuário técnico que o Almoxarifado usa (HTTP Basic) em
    # POST /api/integracao/almoxarifado/recebimentos. Só é criado quando a senha
    # vier configurada. No Almoxarifado: PATRIMONIO_USUARIO / PATRIMONIO_SENHA.
    almoxarifado:
      login: ${INTEGRACAO_ALMOXARIFADO_LOGIN:integracao.almoxarifado}
      senha: ${INTEGRACAO_ALMOXARIFADO_SENHA:}
  frota:
    # Dados de demonstração da frota (6 veículos com histórico, usuário motorista.demo).
    # Só para homologação: ligado no perfil dev; em produção use FROTA_SEED=true conscientemente.
    seed: ${FROTA_SEED:false}
    seed-senha-motorista: ${FROTA_SEED_SENHA_MOTORISTA:trocar123}
    # Importação do sistema Transportes FPTO (banco PostgreSQL "transportes").
    # Sem a URL a importação fica desligada. Idempotente (pode rodar a cada boot).
    transportes:
      url: ${TRANSPORTES_DB_URL:}
      usuario: ${TRANSPORTES_DB_USER:transportes}
      senha: ${TRANSPORTES_DB_SENHA:}
      importar-no-boot: ${TRANSPORTES_IMPORTAR_NO_BOOT:true}
  importacao:
    # Seed automático da planilha base no primeiro start.
    # Idempotente: só roda se o banco estiver sem patrimônios.
    habilitada: true
    # Aceita "classpath:..." (padrão, usado em demo/apresentação)
    # ou "file:./caminho/para/arquivo.xlsx" (produção com arquivo externo).
    caminho: classpath:seed/patrimonio-inicial.xlsx

# Logging mais verboso em dev (sobreposto no application-prod.yml)
logging:
  level:
    root: INFO
    com.fundacao.gerenciador_patrimonial: DEBUG
