plugins {
    id 'java'
    // Spring Boot 3.3.x — versão LTS estável
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.fundacao'
version = '0.0.1-SNAPSHOT'
description = 'Gerenciador_Patrimonial'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Sobrepõe a versão de Flyway gerenciada pelo Spring Boot 3.3.5
ext['flyway.version'] = '10.20.1'

repositories {
    mavenCentral()
}

dependencies {
    // --- Core Spring Boot ---
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // --- Segurança (CORRIGIDO: Removido o "git" do final) ---
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // --- Migrações de banco (Flyway) ---
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly    'org.flywaydb:flyway-database-postgresql'

    // --- Leitura/Escrita de Excel ---
    implementation 'org.apache.poi:poi-ooxml:5.3.0'

    // --- Geração de PDF ---
    implementation 'com.github.librepdf:openpdf:1.3.34'

    // --- Lombok ---
    compileOnly         'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // --- Dev / banco em memória ---
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly     'com.h2database:h2'
    runtimeOnly     'org.postgresql:postgresql'

    // --- Testes ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
// =============================================================================
// Front-end React (pasta frontend/, Vite). O build gera a SPA em build/frontend
// e o processResources copia para static/app, que o Spring serve em /app.
// Requer Node 20+ (o Dockerfile instala). Para pular: -PsemFrontend
// =============================================================================
def npmCmd = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'
def semFrontend = project.hasProperty('semFrontend')

tasks.register('npmInstall', Exec) {
    description = 'Instala as dependências do front-end (npm ci)'
    workingDir 'frontend'
    inputs.files('frontend/package.json', 'frontend/package-lock.json')
    outputs.dir('frontend/node_modules')
    commandLine npmCmd, 'ci', '--no-audit', '--no-fund'
    onlyIf { !semFrontend }
}

tasks.register('buildFrontend', Exec) {
    description = 'Compila a SPA React para build/frontend/static/app'
    dependsOn 'npmInstall'
    workingDir 'frontend'
    inputs.dir('frontend/src')
    inputs.files('frontend/index.html', 'frontend/vite.config.ts', 'frontend/package.json', 'frontend/tsconfig.app.json')
    outputs.dir(layout.buildDirectory.dir('frontend'))
    commandLine npmCmd, 'run', 'build'
    onlyIf { !semFrontend }
}

tasks.named('processResources') {
    // Com -PsemFrontend não recompila a SPA, mas mantém a última build (se existir) no classpath.
    if (!semFrontend) dependsOn 'buildFrontend'
    from(layout.buildDirectory.dir('frontend'))
}
