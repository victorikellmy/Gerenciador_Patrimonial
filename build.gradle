plugins {
    id 'java'
    // Spring Boot 4.0.x — baseline do ecossistema FPTO
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.fpto'
version = '0.0.1-SNAPSHOT'
description = 'Gerenciador_Patrimonial'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()   // atalho de dev (se a fpto-commons estiver no ~/.m2)
    // GitHub Packages — fpto-commons (somente grupo com.fpto; demais deps vêm do mavenCentral).
    // Credenciais via env GITHUB_ACTOR/GITHUB_TOKEN ou props gpr.user/gpr.key (token com read:packages).
    maven {
        name = 'GitHubPackages'
        url = uri('https://maven.pkg.github.com/victorikellmy/fpto-commons')
        credentials {
            username = System.getenv('GITHUB_ACTOR') ?: findProperty('gpr.user')
            password = System.getenv('GITHUB_TOKEN') ?: findProperty('gpr.key')
        }
        content { includeGroup 'com.fpto' }
    }
    mavenCentral()
}

dependencies {
    // --- Contratos e cross-cutting compartilhados do ecossistema FPTO ---
    implementation 'com.fpto:fpto-commons:0.1.0'

    // --- Core Spring Boot ---
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // --- Segurança (CORRIGIDO: Removido o "git" do final) ---
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    // --- Migrações de banco (Flyway) ---
    // Boot 4 modularizou as autoconfigs: o módulo spring-boot-flyway precisa
    // ser declarado explicitamente (não vem mais transitivo do flyway-core).
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly    'org.flywaydb:flyway-database-postgresql'

    // --- Leitura/Escrita de Excel ---
    implementation 'org.apache.poi:poi-ooxml:5.3.0'

    // --- Geração de PDF ---
    implementation 'com.github.librepdf:openpdf:1.3.34'

    // --- Lombok ---
    compileOnly         'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // --- Dev / banco em memória ---
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly     'com.h2database:h2'
    runtimeOnly     'org.postgresql:postgresql'

    // --- Testes ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}